<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le Quiz de Jenny</title>
<style>
/* ============================================================
   TOKENS — même famille que "La Roue de Jenny" :
   ciel de nuit mauve/doré.
   ============================================================ */
:root{
  --night-1:#2a1c33;
  --night-2:#3d2a49;
  --night-3:#54365f;
  --rose:#f3c6cf;
  --rose-deep:#e39aab;
  --cream:#f8efe2;
  --paper:#fdf7ec;
  --white:#fffaf3;
  --gold:#cfa25f;
  --gold-light:#eeda9f;
  --gold-deep:#9c7233;
  --green:#7fb885;
  --red:#e2643f;
  --ink:#4a3548;
  --ink-soft:#7a6178;
  --shadow-deep: 0 25px 60px rgba(20,10,25,0.5);
  --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua", Georgia, serif;
  --font-script: "Segoe Script","Snell Roundhand","Brush Script MT", cursive;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; overflow:hidden;
  font-family: var(--font-body);
  color: var(--paper);
  -webkit-tap-highlight-color: transparent;
}
body{
  position:relative;
  background: radial-gradient(ellipse at 50% -10%, var(--night-3) 0%, var(--night-2) 45%, var(--night-1) 100%);
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}

#bg-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
#fx-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:60; pointer-events:none; }
.warm-glow{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(circle at 50% 50%, rgba(238,218,159,0.12) 0%, rgba(238,218,159,0) 45%);
}

#stage{
  position:relative; z-index:5;
  width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px;
  padding: 20px;
}
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px;
  opacity:0; visibility:hidden; pointer-events:none;
  transform: scale(0.94);
  transition: opacity .8s cubic-bezier(.22,.61,.36,1), transform 1s cubic-bezier(.22,.61,.36,1), visibility 0s linear .8s;
  padding: 18px;
}
.screen.active{
  opacity:1; visibility:visible; pointer-events:auto;
  transform: scale(1);
  transition: opacity .8s cubic-bezier(.22,.61,.36,1), transform 1s cubic-bezier(.22,.61,.36,1), visibility 0s linear 0s;
}
.screen.zoom-out{ transform: scale(1.3); opacity:0; }

.eyebrow{
  font-family: var(--font-script);
  font-size: clamp(18px, 3.2vw, 26px);
  color: var(--gold-light);
  text-shadow: 0 0 16px rgba(238,218,159,0.3);
}
.title-display{
  font-family: var(--font-display);
  font-weight:500;
  font-size: clamp(26px, 4.6vw, 40px);
  text-align:center;
}

/* ============================================================
   PROGRESSION
   ============================================================ */
.progress-wrap{
  width: min(90vw, 460px);
  display:flex; align-items:center; gap:10px;
}
.progress-track{
  flex:1; height:6px; border-radius:999px;
  background: rgba(255,250,243,0.15);
  overflow:hidden;
}
.progress-fill{
  height:100%; width:0%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold-light));
  transition: width .5s cubic-bezier(.22,.61,.36,1);
}
.progress-label{
  font-size:12px; color: var(--gold-light);
  font-variant-numeric: tabular-nums;
  white-space:nowrap;
}

/* ============================================================
   CARTE QUESTION
   ============================================================ */
.quiz-card{
  width: min(92vw, 460px);
  background: linear-gradient(160deg, var(--paper), var(--cream));
  border-radius: 20px;
  padding: 30px 26px 26px;
  box-shadow: var(--shadow-deep), 0 0 0 1px rgba(238,218,159,0.35);
  color: var(--ink);
}
.quiz-question{
  font-family: var(--font-display);
  font-size: clamp(18px, 3.4vw, 22px);
  line-height:1.4;
  margin-bottom: 20px;
  text-align:center;
}
.options{
  display:flex; flex-direction:column; gap:10px;
}
.option-btn{
  font-family: var(--font-body);
  font-size: 15px;
  text-align:left;
  color: var(--ink);
  background: var(--white);
  border: 1.5px solid rgba(159,116,45,0.2);
  border-radius: 14px;
  padding: 13px 16px;
  cursor:pointer;
  transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
}
.option-btn:hover:not(:disabled){
  transform: translateX(3px);
  border-color: var(--gold);
  box-shadow: 0 4px 12px rgba(159,116,45,0.15);
}
.option-btn:disabled{ cursor:default; }
.option-btn.correct{
  background: rgba(127,184,133,0.18);
  border-color: var(--green);
  color: #3f6b46;
  font-weight:600;
}
.option-btn.wrong{
  background: rgba(226,100,63,0.14);
  border-color: var(--red);
  color: #9c3f24;
}

.btn-next{
  margin-top: 18px;
  align-self:center;
  font-family: var(--font-body);
  font-weight:700;
  font-size: 15px;
  color: var(--night-1);
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  border:none;
  padding: 13px 30px;
  border-radius: 999px;
  cursor:pointer;
  box-shadow: 0 8px 20px rgba(159,116,45,0.35);
  opacity:0; transform: translateY(8px);
  pointer-events:none;
  transition: opacity .5s ease, transform .5s ease, filter .18s ease;
}
.btn-next.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
.btn-next:hover{ filter:brightness(1.05); }

/* ============================================================
   ÉCRAN RÉSULTATS
   ============================================================ */
#screen-result .quiz-card{ text-align:center; }
.score-big{
  font-family: var(--font-display);
  font-size: clamp(38px, 8vw, 56px);
  color: var(--gold-deep);
  margin-bottom: 6px;
}
.score-sub{
  font-size: 13px; color: var(--ink-soft);
  text-transform:uppercase; letter-spacing:0.06em;
  margin-bottom: 18px;
}
.score-message{
  font-family: var(--font-display);
  font-size: 17px; line-height:1.6;
  margin-bottom: 22px;
}
.btn-secondary{
  font-family: var(--font-body);
  font-weight:600; font-size:15px;
  color: var(--white);
  background: linear-gradient(180deg, var(--night-3), var(--night-1));
  border:none;
  padding: 13px 28px;
  border-radius: 999px;
  cursor:pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  transition: transform .18s ease;
  margin: 0 6px;
}
.btn-secondary:hover{ transform: translateY(-2px); }

/* ============================================================
   ÉCRAN FIN SECRÈTE
   ============================================================ */
#screen-ending .title-display{
  max-width: 640px;
  font-size: clamp(22px, 4vw, 34px);
  line-height:1.5;
  min-height: 4.5em;
}
.typewriter-cursor{
  display:inline-block; width:2px; height:1em; background:var(--gold-light);
  margin-left:2px; vertical-align:-0.15em;
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }
.finale-text{
  font-family: var(--font-script);
  font-size: clamp(20px,3.4vw,28px);
  color: var(--rose);
  text-align:center;
  opacity:0; transform:translateY(10px);
  transition: opacity 1.1s ease, transform 1.1s ease;
}
.finale-text.show{ opacity:1; transform:translateY(0); }
.btn-final{
  font-family: var(--font-script);
  font-size: clamp(19px, 3vw, 25px);
  color: var(--night-1);
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  border:none;
  padding: 15px 38px;
  border-radius: 999px;
  cursor:pointer;
  box-shadow: 0 10px 24px rgba(159,116,45,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
  opacity:0; transform: translateY(14px);
  transition: opacity 1s ease, transform 1s ease, filter .2s ease;
}
.btn-final.show{ opacity:1; transform:translateY(0); }
.btn-final:hover{ filter:brightness(1.05); }

@media (max-width: 420px){
  .quiz-card{ padding: 24px 18px 20px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="warm-glow"></div>
<canvas id="fx-canvas"></canvas>

<div id="stage">

  <!-- ============== ÉCRAN QUIZ ============== -->
  <section id="screen-quiz" class="screen active">
    <span class="eyebrow">Est-ce que tu me connais bien ?</span>
    <h2 class="title-display">Le Quiz de Jenny</h2>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">1/8</span>
    </div>

    <div class="quiz-card">
      <p class="quiz-question" id="quiz-question"></p>
      <div class="options" id="quiz-options"></div>
      <button class="btn-next" id="btn-next">Suivant →</button>
    </div>
  </section>

  <!-- ============== ÉCRAN RÉSULTATS ============== -->
  <section id="screen-result" class="screen">
    <div class="quiz-card">
      <div class="score-big" id="score-big">0/8</div>
      <div class="score-sub">Bonnes réponses</div>
      <p class="score-message" id="score-message"></p>
      <button class="btn-secondary" id="btn-retry">↺ Rejouer</button>
      <button class="btn-secondary" id="btn-see-ending">Suite ❤️</button>
    </div>
  </section>

  <!-- ============== ÉCRAN FIN SECRÈTE ============== -->
  <section id="screen-ending" class="screen">
    <h2 class="title-display" id="finale-line-1"><span class="typewriter-cursor"></span></h2>
    <p class="finale-text" id="finale-line-2">Et si on écrivait la suite... ensemble ? ❤️</p>
    <button class="btn-final" id="btn-continue">✨ Continuer notre histoire</button>
  </section>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   0. UTILITAIRES
   ============================================================ */
const $ = (sel) => document.querySelector(sel);
const rand = (min, max) => Math.random() * (max - min) + min;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, gainPeak){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.07, ctx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}
function playClickSound(){ playTone(620, 0.08, "sine", 0.05); }
function playCorrectSound(){
  [660, 880, 1100].forEach((f,i)=> setTimeout(()=>playTone(f, 0.35, "sine", 0.05), i*80));
}
function playWrongSound(){ playTone(160, 0.2, "triangle", 0.05); }
function playWinSound(){
  [523, 659, 784, 1046].forEach((f,i)=> setTimeout(()=>playTone(f, 0.5, "sine", 0.05), i*110));
}
function vibrate(pattern){
  if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
}

/* ============================================================
   1. FOND ANIMÉ — étoiles + cœurs flottants + parallaxe
   ============================================================ */
const bgCanvas = $("#bg-canvas");
const bgCtx = bgCanvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resizeCanvas(canvas, ctx){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas(bgCanvas, bgCtx);

let stars = [];
let floatHearts = [];
function initBackground(){
  stars = [];
  const starCount = Math.floor((W*H)/9000);
  for(let i=0;i<starCount;i++){
    stars.push({ x: rand(0,W), y: rand(0,H*0.85), r: rand(0.5,1.8), baseA: rand(0.25,0.9), speed: rand(0.6,2.0), phase: rand(0,Math.PI*2), depth: rand(0.2,1) });
  }
  floatHearts = [];
  const heartCount = Math.floor(W/140) + 4;
  for(let i=0;i<heartCount;i++) floatHearts.push(makeHeart());
}
function makeHeart(){
  return { x: rand(0,W), y: rand(H*0.2,H+60), size: rand(8,20), speed: rand(6,16), drift: rand(-8,8), opacity: rand(0.1,0.28), sway: rand(0,Math.PI*2), depth: rand(0.3,1) };
}
let mouseX=0.5, mouseY=0.5;
window.addEventListener("mousemove",(e)=>{ mouseX=e.clientX/W; mouseY=e.clientY/H; });
window.addEventListener("touchmove",(e)=>{ if(e.touches && e.touches[0]){ mouseX=e.touches[0].clientX/W; mouseY=e.touches[0].clientY/H; } },{passive:true});

function drawHeartShape(ctx,x,y,s){
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x,y, x-s*0.5,y, x-s*0.5,y+s*0.3);
  ctx.bezierCurveTo(x-s*0.5,y+s*0.6, x,y+s*0.8, x,y+s);
  ctx.bezierCurveTo(x,y+s*0.8, x+s*0.5,y+s*0.6, x+s*0.5,y+s*0.3);
  ctx.bezierCurveTo(x+s*0.5,y, x,y, x,y+s*0.3);
  ctx.closePath();
}

let lastT = performance.now();
function animateBackground(t){
  const dt = Math.min((t-lastT)/1000, 0.05);
  lastT = t;
  bgCtx.clearRect(0,0,W,H);
  const parX=(mouseX-0.5)*14, parY=(mouseY-0.5)*10;
  for(const s of stars){
    s.phase += dt*s.speed;
    const a = s.baseA * (0.55 + 0.45*Math.sin(s.phase));
    bgCtx.beginPath();
    bgCtx.fillStyle = "rgba(255,250,235,"+a.toFixed(3)+")";
    bgCtx.arc(s.x+parX*s.depth, s.y+parY*s.depth, s.r, 0, Math.PI*2);
    bgCtx.fill();
  }
  for(const h of floatHearts){
    h.y -= h.speed*dt;
    h.sway += dt*0.6;
    const x = h.x + Math.sin(h.sway)*h.drift + parX*h.depth*0.6;
    bgCtx.save();
    bgCtx.globalAlpha = h.opacity;
    bgCtx.fillStyle = "#f3c6cf";
    drawHeartShape(bgCtx, x, h.y+parY*h.depth*0.6, h.size);
    bgCtx.fill();
    bgCtx.restore();
    if(h.y < -40){ Object.assign(h, makeHeart()); h.y = H+40; }
  }
  requestAnimationFrame(animateBackground);
}
window.addEventListener("resize", ()=>{ resizeCanvas(bgCanvas,bgCtx); resizeCanvas(fxCanvas,fxCtx); initBackground(); });

/* ============================================================
   2. CANVAS D'EFFETS
   ============================================================ */
const fxCanvas = $("#fx-canvas");
const fxCtx = fxCanvas.getContext("2d");
resizeCanvas(fxCanvas, fxCtx);
let fxParticles = [];
const CONFETTI_COLORS = ["#f3c6cf","#eeda9f","#cfa25f","#fffaf3","#e39aab"];
function burstConfetti(x,y,count){
  count = count||55;
  for(let i=0;i<count;i++){
    const angle = rand(0,Math.PI*2), speed = rand(2,7);
    fxParticles.push({ type:"confetti", x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-rand(1,3), size:rand(4,9), rot:rand(0,Math.PI*2), vrot:rand(-0.2,0.2), color:pick(CONFETTI_COLORS), life:1, decay:rand(0.006,0.012), gravity:0.12 });
  }
}
function burstSparkles(x,y,count){
  count = count||16;
  for(let i=0;i<count;i++){
    const angle = rand(0,Math.PI*2), speed = rand(1,3.5);
    fxParticles.push({ type:"spark", x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, size:rand(1.5,3.2), life:1, decay:rand(0.02,0.04), color:"#eeda9f" });
  }
}
function animateFx(){
  fxCtx.clearRect(0,0,W,H);
  fxParticles = fxParticles.filter(p=>{
    if(p.type==="confetti"){
      p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot; p.life-=p.decay;
      if(p.life<=0) return false;
      fxCtx.save(); fxCtx.globalAlpha=Math.max(p.life,0);
      fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
      fxCtx.fillStyle=p.color; fxCtx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.6);
      fxCtx.restore(); return true;
    }
    if(p.type==="spark"){
      p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
      if(p.life<=0) return false;
      fxCtx.save(); fxCtx.globalAlpha=Math.max(p.life,0);
      fxCtx.fillStyle=p.color; fxCtx.shadowColor=p.color; fxCtx.shadowBlur=8;
      fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.size,0,Math.PI*2); fxCtx.fill();
      fxCtx.restore(); return true;
    }
    return false;
  });
  requestAnimationFrame(animateFx);
}

/* ============================================================
   3. LE QUIZ — questions personnalisées
   ============================================================ */
const QUESTIONS = [
  { q: "Où est-ce qu'on s'est rencontrés ?",
    options: ["En soirée", "Au travail", "Sur une appli de rencontre", "À la salle de sport"],
    correct: 0 },
  { q: "Quelle est la date de notre premier bisou ?",
    options: ["14 février 2026", "11 août 2026", "1er juin 2026", "25 décembre 2025"],
    correct: 1 },
  { q: "Qu'est-ce que j'ai remarqué en premier chez toi ?",
    options: ["Ton rire", "Ta façon de parler", "Ton regard et ta douceur", "Tes fringues"],
    correct: 2 },
  { q: "Comment je t'appelle, la plupart du temps ?",
    options: ["Bébé", "Ma puce", "Chérie", "Mon cœur"],
    correct: 3 },
  { q: "Dans notre langage à nous, comment on dit 'love bombing' ?",
    options: ["Coup de foudre", "Bombe d'amour", "Baby boom", "Craquage total"],
    correct: 2 },
  { q: "Quel est ton plat préféré ?",
    options: ["Les sushis", "Les lasagnes", "La pizza", "Le couscous"],
    correct: 1 },
  { q: "Qu'est-ce que tu détestes, niveau boisson ?",
    options: ["Le café", "Le matcha", "Le thé", "Le chocolat chaud"],
    correct: 1 },
  { q: "Où je t'ai emmenée pour la toute première fois de ta vie ?",
    options: ["Le Louvre", "Disneyland Paris", "La Tour Eiffel", "L'Arc de Triomphe"],
    correct: 2 }
];

const screenQuiz = $("#screen-quiz");
const screenResult = $("#screen-result");
const screenEnding = $("#screen-ending");
const quizQuestion = $("#quiz-question");
const quizOptions = $("#quiz-options");
const btnNext = $("#btn-next");
const progressFill = $("#progress-fill");
const progressLabel = $("#progress-label");

let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  const copy = [...arr];
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(rand(0,i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}

function renderQuestion(){
  answered = false;
  btnNext.classList.remove("show");
  const data = QUESTIONS[currentIndex];
  quizQuestion.textContent = data.q;
  progressFill.style.width = ((currentIndex) / QUESTIONS.length * 100) + "%";
  progressLabel.textContent = (currentIndex+1) + "/" + QUESTIONS.length;

  // On garde la trace de la bonne réponse (texte) avant mélange, pour rester robuste.
  const correctText = data.options[data.correct];
  const shuffled = shuffle(data.options);

  quizOptions.innerHTML = "";
  shuffled.forEach((optionText)=>{
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.type = "button";
    btn.textContent = optionText;
    btn.addEventListener("click", ()=> onAnswer(btn, optionText, correctText));
    quizOptions.appendChild(btn);
  });
}

function onAnswer(btn, chosenText, correctText){
  if(answered) return;
  answered = true;
  ensureAudioCtx();

  const allBtns = quizOptions.querySelectorAll(".option-btn");
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = chosenText === correctText;
  if(isCorrect){
    btn.classList.add("correct");
    score++;
    playCorrectSound();
    vibrate([10,20,10]);
    const rect = btn.getBoundingClientRect();
    burstSparkles(rect.left + rect.width/2, rect.top + rect.height/2, 12);
  } else {
    btn.classList.add("wrong");
    playWrongSound();
    vibrate(20);
    allBtns.forEach(b=>{
      if(b.textContent === correctText) b.classList.add("correct");
    });
  }

  btnNext.classList.add("show");
}

btnNext.addEventListener("click", ()=>{
  ensureAudioCtx();
  playClickSound();
  currentIndex++;
  if(currentIndex >= QUESTIONS.length){
    showResult();
  } else {
    renderQuestion();
  }
});

/* ============================================================
   4. RÉSULTATS
   ============================================================ */
const scoreBig = $("#score-big");
const scoreMessage = $("#score-message");
const btnRetry = $("#btn-retry");
const btnSeeEnding = $("#btn-see-ending");

function getScoreMessage(){
  const total = QUESTIONS.length;
  if(score === total) return "Parfait. Tu connais notre histoire par cœur — normal, tu l'as vécue avec moi.";
  if(score >= total - 2) return "Très bien ! Il y a juste deux-trois détails que je vais devoir te rappeler en vrai.";
  if(score >= total/2) return "Pas mal, mais on va clairement devoir réviser ça... autour d'un café ?";
  return "Bon. On dirait qu'il va falloir qu'on se refasse quelques souvenirs ensemble.";
}

function showResult(){
  progressFill.style.width = "100%";
  screenQuiz.classList.add("zoom-out");
  setTimeout(()=>{
    screenQuiz.classList.remove("active");
    screenResult.classList.add("active");
    scoreBig.textContent = score + "/" + QUESTIONS.length;
    scoreMessage.textContent = getScoreMessage();
    playWinSound();
    vibrate([15,30,15]);
    const rect = screenResult.getBoundingClientRect();
    burstConfetti(W/2, H*0.4, 70);
  }, 900);
}

btnRetry.addEventListener("click", ()=>{
  ensureAudioCtx();
  playClickSound();
  currentIndex = 0;
  score = 0;
  screenResult.classList.remove("active");
  screenResult.classList.remove("zoom-out");
  screenQuiz.classList.remove("zoom-out");
  screenQuiz.classList.add("active");
  renderQuestion();
});

/* ============================================================
   5. FIN SECRÈTE
   ============================================================ */
const finaleLine1 = $("#finale-line-1");
const finaleLine2 = $("#finale-line-2");
const btnContinue = $("#btn-continue");
const FINALE_TEXT = "Peu importe le score... ce que je retiens, c'est chaque instant qu'on a passé à écrire cette histoire ensemble.";

btnSeeEnding.addEventListener("click", ()=>{
  ensureAudioCtx();
  playClickSound();
  screenResult.classList.add("zoom-out");
  setTimeout(()=>{
    screenResult.classList.remove("active");
    screenEnding.classList.add("active");
    typewriterInto(finaleLine1, FINALE_TEXT, 30, ()=>{
      setTimeout(()=> finaleLine2.classList.add("show"), 300);
      setTimeout(()=> btnContinue.classList.add("show"), 900);
    });
  }, 900);
});

function typewriterInto(el, text, speedMs, onDone){
  el.innerHTML = '<span class="typewriter-cursor"></span>';
  let i = 0;
  function step(){
    if(i <= text.length){
      el.innerHTML = text.slice(0,i) + '<span class="typewriter-cursor"></span>';
      i++;
      setTimeout(step, speedMs);
    } else if(onDone){ onDone(); }
  }
  step();
}

btnContinue.addEventListener("click", ()=>{
  ensureAudioCtx();
  playWinSound();
  vibrate([15,40,15]);
  const rect = btnContinue.getBoundingClientRect();
  burstConfetti(rect.left + rect.width/2, rect.top, 90);
  for(let i=0;i<10;i++){
    setTimeout(()=> burstSparkles(rand(0,W), rand(0,H), 8), i*90);
  }
  screenEnding.style.transition = "transform 1.4s cubic-bezier(.22,.61,.36,1)";
  screenEnding.style.transform = "scale(1.5)";
  setTimeout(()=>{
    finaleLine1.innerHTML = "À toi de choisir le prochain chapitre.";
    finaleLine2.classList.remove("show");
    btnContinue.style.display = "none";
  }, 900);
});

/* ============================================================
   6. DÉMARRAGE
   ============================================================ */
initBackground();
requestAnimationFrame(animateBackground);
requestAnimationFrame(animateFx);
renderQuestion();

})();
</script>
